name: SonarQube

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build:
    name: Build and analyze
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile Java sources
        run: |
          mkdir -p build/classes
          javac -encoding UTF-8 -d build/classes Packman/src/*.java

      - name: Authenticate to SonarQube Cloud
        uses: SonarSource/sonarqube-auth-action@v1.2
        id: auth

      - name: Analyze with SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@v8
        with:
          args: >-
            -Dsonar.organization=${{ steps.auth.outputs.organization }}
            -Dsonar.projectKey=${{ steps.auth.outputs.project-key }}
            -Dsonar.sources=Packman/src
            -Dsonar.java.binaries=build/classes
            -Dsonar.java.source=21
